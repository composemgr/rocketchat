# nginx proxy address - http://172.17.0.1:64330

name: rocketchat
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  server:
    image: registry.rocket.chat/rocketchat/rocket.chat:latest
    container_name: rocketchat-server
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: rocketchat-server
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      # Rocket.Chat web server
      PORT: '3000'
      ROOT_URL: https://${BASE_HOST_NAME:-$HOSTNAME}
      # MongoDB replica set connections
      MONGO_URL: mongodb://rocketchat-db:27017/rocketchat?replicaSet=rs0
    ports:
      - '172.17.0.1:64330:3000'
    volumes:
      - './volumes/data/rocketchat/uploads:/app/uploads:z'
    depends_on:
      - db
    networks:
      - rocketchat

  db:
    image: mongo:latest
    container_name: rocketchat-db
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: rocketchat-db
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: rocketchat-db
    command: ['--replSet', 'rs0', '--bind_ip_all']
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'try { rs.status() } catch (e) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "rocketchat-db:27017"}]}) }; quit(db.hello().isWritablePrimary ? 0 : 1)']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      - './volumes/db/mongodb/rocketchat:/data/db:z'
    networks:
      - rocketchat

networks:
  rocketchat:
    name: rocketchat
    external: false
